name: Reusable — Kubernetes Deploy

on:
  workflow_call:
    inputs:
      environment:
        description: "Target environment (e1/e2/e3)"
        required: true
        type: string
      image-tag:
        description: "Docker image tag to deploy"
        required: true
        type: string
      namespace:
        description: "Kubernetes namespace"
        required: true
        type: string
      helm-chart-path:
        description: "Path to Helm chart"
        required: false
        type: string
        default: "./helm"
      app-name:
        description: "Application name"
        required: true
        type: string
      replicas:
        description: "Number of replicas"
        required: false
        type: number
        default: 2
      require-approval:
        description: "Require manual approval before deploy (use for production)"
        required: false
        type: boolean
        default: false
    secrets:
      KUBECONFIG:
        required: true
      HELM_VALUES:
        required: false

jobs:
  approval:
    name: Manual Approval Gate
    runs-on: ubuntu-latest
    if: ${{ inputs.require-approval == true }}
    environment:
      name: ${{ inputs.environment }}-approval
    steps:
      - name: Awaiting approval
        run: echo "Deployment to ${{ inputs.environment }} approved by ${{ github.actor }}"

  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    needs: [approval]
    if: ${{ always() && (needs.approval.result == 'success' || needs.approval.result == 'skipped') }}
    environment:
      name: ${{ inputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: "3.13.0"

      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > ~/.kube/config
          kubectl version --client

      - name: Verify cluster connection
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: Create namespace if not exists
        run: |
          kubectl create namespace ${{ inputs.namespace }} --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy with Helm
        run: |
          helm upgrade --install ${{ inputs.app-name }} ${{ inputs.helm-chart-path }} \
            --namespace ${{ inputs.namespace }} \
            --set image.tag=${{ inputs.image-tag }} \
            --set replicaCount=${{ inputs.replicas }} \
            --set environment=${{ inputs.environment }} \
            --wait \
            --timeout 5m \
            --atomic

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/${{ inputs.app-name }} \
            -n ${{ inputs.namespace }} \
            --timeout=5m

      - name: Get deployment info
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Key | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| App | \`${{ inputs.app-name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | \`${{ inputs.environment }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Namespace | \`${{ inputs.namespace }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Image Tag | \`${{ inputs.image-tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Replicas | \`${{ inputs.replicas }}\` |" >> $GITHUB_STEP_SUMMARY
          kubectl get pods -n ${{ inputs.namespace }} -l app=${{ inputs.app-name }}
